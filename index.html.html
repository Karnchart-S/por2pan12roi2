  }
  function route() {
    var m = /^#section-(\d+)$/.exec(location.hash);
    if (m) { var i = parseInt(m[1], 10) - 1; if (state.depts[i] !== undefined) return i; }
    return -1;
  }
  function showMsg(text, ok) {
    var el = $("msg");
    el.textContent = text;
    el.className = "msg" + (ok ? " ok" : "");
    el.hidden = false;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { el.hidden = true; }, 6000);
  }

  function ring(p, total, size, sw) {
    var r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
    var label = total ? p + "%" : "–";
    var arc = (total && p > 0)
      ? '<circle class="arc" cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + (c * p / 100).toFixed(2) + " " + c.toFixed(2) + '" transform="rotate(-90 ' + h + " " + h + ')"/>'
      : "";
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" role="img" aria-label="งานสำเร็จ ' + label + '">' +
      '<circle class="trk" cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke-width="' + sw + '"/>' + arc +
      '<text x="' + h + '" y="' + h + '" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size * 0.26) + '">' + label + "</text></svg>";
  }

  var app = $("app");
  app.innerHTML =
    '<div class="banner"><div><div class="eyebrow">แดชบอร์ดติดตามงาน</div><h1>' + esc(ORG) + '</h1></div><div class="asof" id="asof"></div></div>' +
    '<div id="msg" class="msg" role="status" hidden></div>' +
    '<main id="view" style="display:flex;flex-direction:column;gap:20px"></main>' +
    '<div class="savebar" id="savebar" hidden><span>มีการแก้ไขที่ยังไม่ได้บันทึก ผู้เข้าชมจะเห็นหลังกดบันทึก</span>' +
    '<div class="btns"><button type="button" class="ghost" data-act="discard">ยกเลิกการแก้ไข</button>' +
    '<button type="button" class="primary" id="saveBtn" data-act="save">บันทึกและเผยแพร่</button></div></div>';

  function renderAsof() {
    var upd = new Date(state.updated);
    $("asof").textContent = "วันนี้ " + TODAY + (isNaN(upd.getTime()) ? "" : " · แก้ไขล่าสุด " + upd.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }));
  }

  function tile(cls, label, num, unit, note) {
    return '<div class="tile"><div class="lab"><i class="dot ' + cls + '"></i>' + label + '</div><div class="num">' + num + "<small>" + unit + '</small></div><div class="note">' + note + "</div></div>";
  }

  function homeHtml() {
    var c = count(state.tasks);
    var out = '<section class="board" aria-label="ส่วนในหน่วย"><div class="bhead"><h2>' + state.depts.length + ' ส่วนของหน่วย</h2>' +
      '<div class="bleg"><span><i class="dot done"></i>ทำแล้ว</span><span><i class="dot monthly"></i>ติดตามรายเดือน (กำลังทำ)</span><span><i class="dot new"></i>งานใหม่ ยังไม่ได้ทำ</span></div></div><div class="cards">';
    state.depts.forEach(function (d, i) {
      var k = count(tasksOf(d));
      out += '<a class="card" href="#section-' + (i + 1) + '"><span class="no">' + (i + 1) + '</span><div class="ring">' + ring(pct(k.done, k.total), k.total, 92, 10) + "</div>" +
        "<h3>" + esc(d) + "</h3>" +
        '<div class="s2">' + (k.total ? "เสร็จ " + k.done + " จาก " + k.total + " งาน" : "ยังไม่มีงาน") + "</div>" +
        '<div class="leg"><span class="cnt done" title="ทำแล้ว">' + k.done + '</span><span class="cnt monthly" title="ติดตามรายเดือน">' + k.monthly + '</span><span class="cnt new" title="งานใหม่ ยังไม่ได้ทำ">' + k["new"] + "</span></div></a>";
    });
    out += "</div>";
    if (canEdit) {
      out += '<form class="bfoot" id="secForm"><div class="t">เพิ่มส่วนใหม่</div>' +
        '<input type="text" id="secName" placeholder="ชื่อส่วน" aria-label="ชื่อส่วน" required>' +
        '<button type="submit" class="primary">เพิ่มส่วน</button></form>';
    }
    out += "</section>";
    out += '<section class="sum" aria-label="สรุปผล"><div class="sechead"><h2>สรุปผล</h2><span>รวมทุกส่วนของหน่วย</span></div><div class="tiles">' +
      tile("", "งานย่อยทั้งหมด", c.total, "งาน", "ใน " + state.depts.length + " ส่วน") +
      tile("done", "ทำแล้ว", c.done, pct(c.done, c.total) + "%", "เสร็จสมบูรณ์") +
      tile("monthly", "ติดตามรายเดือน", c.monthly, "งาน", "รอบ " + MON + " เสร็จแล้ว " + c.mDone + " จาก " + c.monthly) +
      tile("new", "งานใหม่ ยังไม่ได้ทำ", c["new"], pct(c["new"], c.total) + "%", "รอเริ่มดำเนินการ") +
      "</div></section>";
    return out;
  }

  function editRowHtml(t) {
    var opts = ORDER.map(function (k) { return '<option value="' + k + '"' + (t.status === k ? " selected" : "") + ">" + STATUS[k] + "</option>"; }).join("");
    var dopts = state.depts.map(function (d) { return '<option value="' + esc(d) + '"' + (t.dept === d ? " selected" : "") + ">" + esc(d) + "</option>"; }).join("");
    return '<div class="editrow"><input type="text" id="eName" value="' + esc(t.name) + '" aria-label="ชื่องาน">' +
      '<select id="eDept" aria-label="ส่วน">' + dopts + "</select>" +
      '<select id="eStatus" aria-label="สถานะ">' + opts + "</select>" +
      '<button type="button" class="primary" data-act="editok" data-id="' + t.id + '">ตกลง</button>' +
      '<button type="button" class="ghost" data-act="editcancel">ยกเลิก</button></div>';
  }

  function taskHtml(t) {
    if (editId === t.id) return editRowHtml(t);
    var out = '<div class="task"><div class="name">' + esc(t.name) + '</div><div class="ctl">';
    if (t.status === "monthly") {
      var ok = t.m === MK;
      var label = MON + (ok ? ": เสร็จแล้ว" : ": รอทำ");
      out += canEdit
        ? '<button type="button" class="mchip ' + (ok ? "ok" : "wait") + '" data-act="month" data-id="' + t.id + '" title="กดเพื่อสลับสถานะรอบเดือนนี้">' + label + "</button>"
        : '<span class="mchip ' + (ok ? "ok" : "wait") + '">' + label + "</span>";
    }
    out += canEdit
      ? '<button type="button" class="pill ' + t.status + '" data-act="cycle" data-id="' + t.id + '" title="กดเพื่อเปลี่ยนสถานะ"><i class="dot"></i>' + STATUS[t.status] + "</button>"
      : '<span class="pill ' + t.status + '"><i class="dot"></i>' + STATUS[t.status] + "</span>";
    if (canEdit) {
      out += '<button type="button" class="mini" data-act="edit" data-id="' + t.id + '">แก้ไข</button>' +
        (confirmId === t.id
          ? '<button type="button" class="mini sure" data-act="del" data-id="' + t.id + '">ยืนยันลบ</button>'
          : '<button type="button" class="mini danger" data-act="del" data-id="' + t.id + '">ลบ</button>');
    }
    return out + "</div></div>";
  }

  function detailHtml(i) {
    var name = state.depts[i], list = tasksOf(name), k = count(list);
    var out = '<a class="back" href="#">‹ กลับไปทุกส่วน</a>';
    out += '<div class="dhead"><div class="ring">' + ring(pct(k.done, k.total), k.total, 120, 12) + '</div><div class="t">';
    if (renameMode) {
      out += '<div class="renamerow"><input type="text" id="renameInput" value="' + esc(name) + '" aria-label="ชื่อส่วน">' +
        '<button type="button" class="primary" data-act="renameok">ตกลง</button><button type="button" class="ghost" data-act="renamecancel">ยกเลิก</button></div>';
    } else {
      out += "<h2>" + esc(name) + "</h2>";
    }
    out += '<div class="s2">' + (k.total ? "ทำเสร็จแล้ว " + k.done + " จาก " + k.total + " งาน" : "ส่วนนี้ยังไม่มีงาน") + "</div>";
    if (canEdit && !renameMode) {
      out += '<div class="acts"><button type="button" class="mini" data-act="rename">เปลี่ยนชื่อส่วน</button>';
      if (!k.total) {
        out += confirmSec
          ? '<button type="button" class="mini sure" data-act="delsec">ยืนยันลบส่วนนี้</button>'
          : '<button type="button" class="mini danger" data-act="delsec">ลบส่วนนี้</button>';
      }
      out += "</div>";
    }
    out += "</div></div>";
    out += '<section class="tiles three">' +
      tile("monthly", "ติดตามรายเดือน", k.monthly, "งาน", "รอบ " + MON + " เสร็จแล้ว " + k.mDone + " จาก " + k.monthly) +
      tile("new", "งานใหม่ ยังไม่ได้ทำ", k["new"], "งาน", "รอเริ่มดำเนินการ") +
      tile("done", "ทำแล้ว", k.done, "งาน", "เสร็จสมบูรณ์") + "</section>";
    out += '<section class="panel"><div class="sechead" style="margin-bottom:12px"><h2>รายการงานในส่วนนี้</h2></div>';
    var any = false;
    SHOW.forEach(function (s) {
      var g = list.filter(function (t) { return t.status === s; });
      if (!g.length) return;
      any = true;
      out += '<div class="group"><h3><i class="dot ' + s + '"></i>' + STATUS[s] + '<span class="n">' + g.length + " งาน</span></h3>" + g.map(taskHtml).join("") + "</div>";
    });
    if (!any) out += '<div class="empty">ยังไม่มีงานในส่วนนี้' + (canEdit ? " เพิ่มงานแรกได้ด้านล่าง" : "") + "</div>";
    if (canEdit) {
      out += '<form class="add" id="addForm"><div class="t">เพิ่มงานในส่วนนี้</div>' +
        '<input type="text" id="addName" placeholder="ชื่องาน" aria-label="ชื่องาน" required>' +
        '<select id="addStatus" aria-label="สถานะ"><option value="new">งานใหม่ ยังไม่ได้ทำ</option><option value="monthly">ติดตามรายเดือน</option><option value="done">ทำแล้ว</option></select>' +
        '<button type="submit" class="primary">เพิ่มงาน</button></form>';
    }
    return out + "</section>";
  }

  function render() {
    var i = route();
    renderAsof();
    $("view").innerHTML = i >= 0 ? detailHtml(i) : homeHtml();
    $("savebar").hidden = !(canEdit && isDirty());
  }

  function buildDoc() {
    state.updated = new Date().toISOString();
    var data = JSON.stringify(state).replace(/</g, "\\u003c");
    var content =
      "<title>" + TITLE + "</title>\n" +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="' + FONT + '">\n' +
      '<style id="css">' + CSS + "</style>\n\n" +
      '<div class="wrap" id="app"></div>\n\n' +
      '<scr' + 'ipt id="data" type="application/json">' + data + "</scr" + "ipt>\n\n" +
      '<scr' + 'ipt id="code">' + CODE + "</scr" + "ipt>\n";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      RESET + "</style></head><body>" + content + "</body></html>";
  }

  function save() {
    if (saving || !ns) return;
    saving = true;
    $("saveBtn").disabled = true;
    $("saveBtn").textContent = "กำลังบันทึก...";
    ns.publish(buildDoc()).then(function () {
      // The shell reloads this view to the new version.
    }, function (e) {
      saving = false;
      $("saveBtn").disabled = false;
      $("saveBtn").textContent = "บันทึกและเผยแพร่";
      var code = e && e.code;
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required") {
        canEdit = false;
        render();
        showMsg("บัญชีนี้ไม่มีสิทธิ์บันทึกแก้ไข ติดต่อเจ้าของหน้านี้เพื่อขอสิทธิ์ผู้แก้ไข");
      } else if (code === "conflict") {
        showMsg("มีผู้อื่นบันทึกไปก่อน หน้านี้จะโหลดข้อมูลล่าสุดให้ แล้วแก้ไขซ้ำอีกครั้ง");
      } else if (code === "rate_limited") {
        showMsg("บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่");
      } else {
        showMsg("บันทึกไม่สำเร็จ ลองอีกครั้ง");
      }
    });
  }

  function resetUi() { editId = null; confirmId = null; renameMode = false; confirmSec = false; }

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    var act = el ? el.getAttribute("data-act") : "";
    if ((confirmId !== null && act !== "del") || (confirmSec && act !== "delsec")) {
      confirmId = null; confirmSec = false;
      if (!el) { render(); return; }
    }
    if (!el) return;
    var id = el.getAttribute("data-id"), t, i = route();
    if (act === "save") { save(); return; }
    if (act === "discard") { state = JSON.parse(savedStr); resetUi(); if (route() < 0 && location.hash) location.hash = ""; render(); return; }
    if (!canEdit) return;
    if (act === "editcancel") { editId = null; render(); return; }
    if (act === "rename") { renameMode = true; render(); var ri = $("renameInput"); if (ri) ri.focus(); return; }
    if (act === "renamecancel") { renameMode = false; render(); return; }
    if (act === "renameok" && i >= 0) {
      var nn = $("renameInput").value.trim(), old = state.depts[i];
      if (!nn) { showMsg("กรอกชื่อส่วน"); return; }
      if (nn !== old && state.depts.indexOf(nn) >= 0) { showMsg("มีส่วนชื่อนี้อยู่แล้ว"); return; }
      state.depts[i] = nn;
      state.tasks.forEach(function (x) { if (x.dept === old) x.dept = nn; });
      renameMode = false; render(); return;
    }
    if (act === "delsec" && i >= 0) {
      if (confirmSec) {
        state.depts.splice(i, 1); confirmSec = false; location.hash = ""; render();
      } else { confirmSec = true; render(); }
      return;
    }
    t = find(id);
    if (!t) return;
    if (act === "edit") { editId = t.id; render(); return; }
    if (act === "editok") {
      var name = $("eName").value.trim();
      if (!name) { showMsg("กรอกชื่องาน"); return; }
      t.name = name; t.dept = $("eDept").value; t.status = $("eStatus").value;
      if (t.status !== "monthly") t.m = "";
      editId = null; render(); return;
    }
    if (act === "cycle") { t.status = ORDER[(ORDER.indexOf(t.status) + 1) % ORDER.length]; if (t.status !== "monthly") t.m = ""; }
    if (act === "month") { t.m = t.m === MK ? "" : MK; }
    if (act === "del") {
      if (confirmId === t.id) { state.tasks = state.tasks.filter(function (x) { return x !== t; }); confirmId = null; }
      else { confirmId = t.id; render(); return; }
    }
    render();
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!canEdit) return;
    var f = e.target.id, i = route();
    if (f === "secForm") {
      var sn = $("secName").value.trim();
      if (!sn) return;
      if (state.depts.indexOf(sn) >= 0) { showMsg("มีส่วนชื่อนี้อยู่แล้ว"); return; }
      state.depts.push(sn);
      render();
    } else if (f === "addForm" && i >= 0) {
      var name = $("addName").value.trim();
      if (!name) return;
      state.tasks.push({ id: state.next++, dept: state.depts[i], name: name, status: $("addStatus").value, m: "" });
      render();
      $("addName").focus();
    }
  });

  window.addEventListener("hashchange", function () { resetUi(); render(); window.scrollTo(0, 0); });

  render();

  try {
    if (window.claude && window.claude.use) {
      Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
        ns = r[0];
        return r[1] ? r[1].canEdit() : false;
      }).then(function (ce) {
        canEdit = !!(ce && ns);
        render();
      }, function () {});
    }
  } catch (err) {}
})();
</script>
</body></html>
